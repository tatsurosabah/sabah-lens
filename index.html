<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sabah Lens</title>
<meta name="description" content="サバ州の無国籍・難民ニュースを写真で追う">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sabah Lens">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
/* Sabah Lens — 写真を主役にしたニュースリーダー。
   sabah-watch（文字だけのリスト）のビジュアル版フォーク。

   方針:
     - 記事の og:image をカードいっぱいに使う。読む前に「何の話か」が絵で入る
     - 画像が取れない記事はタグ色のタイポグラフィカードにして、リズムを作る
     - 濃紺(#0b1020)の地に白カード。写真の彩度が上がり、夜に読んでも眩しくない
     - ブランド色はサバ州旗の royal blue と chilli red から取る */

:root {
  --bg: #0b1020;
  --bg-2: #131a30;
  --card: #ffffff;
  --ink: #0e1428;
  --sub: #5b6480;
  --faint: #8b93aa;
  --line: #e6e8f0;

  --royal: #1b4ae0;     /* 州旗の紺を画面用に少し明るくした */
  --chilli: #f5362f;
  --zircon: #0484d6;
  --icicle: #77ccff;

  --on-dark: #eef1f8;
  --on-dark-sub: #9aa3bd;

  --radius: 18px;
  --radius-sm: 12px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--on-dark);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP",
    "Segoe UI", Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
/* overflow-x: hidden は付けない。html/body どちらに付けてもそこがクリップ元になり、
   追い読み用の IntersectionObserver が発火しなくなる。横スクロールが要るのは
   タグ列だけで、そこは .chips 自身が overflow-x: auto を持っている。 */
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
a { color: inherit; text-decoration: none; }
img { display: block; }

.wrap { max-width: 680px; margin: 0 auto; padding: 0 14px; }

/* ─────────────── ヘッダー ─────────────── */

.top {
  position: sticky; top: 0; z-index: 40;
  padding-top: var(--safe-t);
  background: rgba(11, 16, 32, .82);
  backdrop-filter: saturate(160%) blur(14px);
  -webkit-backdrop-filter: saturate(160%) blur(14px);
  border-bottom: 1px solid rgba(255, 255, 255, .07);
}
.top-row { display: flex; align-items: center; gap: 10px; height: 52px; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 17px; letter-spacing: -.3px; }
.brand .mark {
  width: 26px; height: 26px; border-radius: 7px; flex: none;
  background: linear-gradient(160deg, var(--icicle) 0 38%, var(--zircon) 38% 62%, var(--chilli) 62% 100%);
  box-shadow: 0 2px 10px rgba(4, 132, 214, .35);
}
.brand b { color: #fff; }
.brand span { color: var(--icicle); }
.grow { flex: 1; }

.iconbtn {
  width: 36px; height: 36px; border-radius: 50%;
  display: grid; place-items: center; color: var(--on-dark-sub);
  background: rgba(255, 255, 255, .06);
}
.iconbtn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.iconbtn.on { color: #fff; background: var(--royal); }
.iconbtn .dot {
  position: absolute; margin: -16px 0 0 16px; width: 7px; height: 7px;
  border-radius: 50%; background: var(--chilli);
}

/* 検索 */
.searchbar { padding-bottom: 10px; display: none; }
.searchbar.open { display: block; }
.searchbar input {
  width: 100%; border: 0; border-radius: 999px; padding: 10px 15px;
  background: rgba(255, 255, 255, .09); color: #fff; font-size: 15px;
}
.searchbar input::placeholder { color: var(--on-dark-sub); }
.searchbar input:focus { outline: 2px solid var(--royal); }

/* タグの横スクロール */
.chips {
  display: flex; gap: 7px; overflow-x: auto; padding: 0 14px 10px;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border-radius: 999px; padding: 6px 13px; font-size: 13px; font-weight: 600;
  background: rgba(255, 255, 255, .07); color: var(--on-dark-sub); white-space: nowrap;
  border: 1px solid transparent; transition: background .15s, color .15s;
}
.chip.on { background: #fff; color: var(--ink); }
.chip .n { opacity: .55; margin-left: 5px; font-size: 11.5px; font-weight: 700; }

/* ─────────────── 見出し行 ─────────────── */

.meta-row {
  display: flex; align-items: center; gap: 8px;
  padding: 14px 0 10px; font-size: 12.5px; color: var(--on-dark-sub);
}
.meta-row .live { width: 7px; height: 7px; border-radius: 50%; background: #35d07f; flex: none; }

/* ─────────────── ヒーロー ─────────────── */

.hero {
  position: relative; display: block; border-radius: var(--radius); overflow: hidden;
  aspect-ratio: 4 / 5; background: var(--bg-2); margin-bottom: 20px;
  box-shadow: 0 18px 44px rgba(0, 0, 0, .45);
}
.hero img { width: 100%; height: 100%; object-fit: cover; }
.hero .scrim {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(6, 9, 20, .94) 0%, rgba(6, 9, 20, .72) 28%, rgba(6, 9, 20, .06) 62%, rgba(6, 9, 20, .3) 100%);
}
.hero .inner { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px; }
.hero h2 {
  margin: 8px 0 10px; font-size: 25px; line-height: 1.28; font-weight: 800;
  letter-spacing: -.5px; color: #fff;
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
}
.hero .orig {
  margin: 0 0 12px; font-size: 12.5px; color: rgba(255, 255, 255, .62); line-height: 1.4;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.hero .kicker {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 11px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase;
  color: #fff; background: var(--chilli); padding: 4px 10px; border-radius: 999px;
}
.hero .foot { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: rgba(255, 255, 255, .8); }

/* ─────────────── カード ─────────────── */

.feed { display: flex; flex-direction: column; gap: 18px; padding-bottom: 28px; }

.card {
  display: block; width: 100%; text-align: left;
  background: var(--card); color: var(--ink);
  border-radius: var(--radius); overflow: hidden;
  box-shadow: 0 6px 20px rgba(0, 0, 0, .28);
  transition: transform .18s ease, opacity .25s ease;
}
.card:active { transform: scale(.985); }

.shot { position: relative; aspect-ratio: 16 / 9; background: #e9ecf4; overflow: hidden; }
.shot img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .4s ease; }
.shot img.in { opacity: 1; }

/* 画像が無い記事。タグ色の面に見出しを大きく置く。
   --c1/--c2 は JS がタグから決めて差し込む。 */
.shot.type {
  display: flex; align-items: flex-end; padding: 18px 16px 16px;
  background: linear-gradient(145deg, var(--c1), var(--c2));
  /* 見出しの長さに合わせて伸縮させる。写真カードと同じ 16:9 に固定すると
     短い見出しのとき色面だけが広く残って間延びする。 */
  aspect-ratio: auto; min-height: 132px;
}
.shot.type::before {
  content: ''; position: absolute; inset: 0; opacity: .16;
  background-image: radial-gradient(circle at 1px 1px, #fff 1px, transparent 0);
  background-size: 13px 13px;
}
.shot.type .tt {
  position: relative; color: #fff; font-weight: 800; font-size: 20px; line-height: 1.32;
  letter-spacing: -.4px; text-shadow: 0 2px 14px rgba(0, 0, 0, .28);
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}

.badge-src {
  position: absolute; top: 10px; left: 10px; z-index: 2;
  background: rgba(255, 255, 255, .95); color: var(--ink);
  font-size: 10.5px; font-weight: 800; letter-spacing: .2px;
  padding: 4px 9px; border-radius: 999px; max-width: 62%;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.shot.type .badge-src { background: rgba(0, 0, 0, .3); color: #fff; }

.star {
  position: absolute; top: 8px; right: 8px; z-index: 3;
  width: 34px; height: 34px; border-radius: 50%;
  background: rgba(255, 255, 255, .95); display: grid; place-items: center;
}
.shot.type .star { background: rgba(0, 0, 0, .3); }
.star svg { width: 17px; height: 17px; fill: none; stroke: var(--sub); stroke-width: 2; stroke-linejoin: round; }
.shot.type .star svg { stroke: #fff; }
.star.on svg { fill: #ffb400; stroke: #ffb400; }

.newdot {
  position: absolute; left: 10px; bottom: 10px; z-index: 2;
  background: var(--chilli); color: #fff; font-size: 10.5px; font-weight: 800;
  letter-spacing: .4px; padding: 3px 8px; border-radius: 999px;
}

.body { padding: 13px 14px 15px; }
.body h3 {
  margin: 0 0 6px; font-size: 17.5px; line-height: 1.4; font-weight: 700; letter-spacing: -.3px;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.body .orig {
  margin: 0 0 9px; font-size: 12.5px; color: var(--faint); line-height: 1.45;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.body .foot { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--sub); flex-wrap: wrap; }
.tag {
  font-size: 11px; font-weight: 700; padding: 2.5px 8px; border-radius: 999px;
  background: #eef1f8; color: #48506a;
}
.tag.k { color: #fff; }
.dotsep { width: 3px; height: 3px; border-radius: 50%; background: currentColor; opacity: .45; flex: none; }

/* 既読は色を落とす。消さずに沈める */
.card.read { opacity: .58; }
.card.read .shot img { filter: grayscale(.75); }

/* ─────────────── 空・読み込み ─────────────── */

.empty { text-align: center; color: var(--on-dark-sub); padding: 60px 20px; }
.empty .big { font-size: 40px; margin-bottom: 10px; }
.skel { border-radius: var(--radius); background: var(--bg-2); height: 260px; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: .5 } 50% { opacity: .8 } }

/* ─────────────── 詳細シート ─────────────── */

.sheet-bg {
  position: fixed; inset: 0; z-index: 60; background: rgba(4, 6, 14, .6);
  opacity: 0; pointer-events: none; transition: opacity .25s ease;
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
}
.sheet-bg.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 61;
  max-height: 92vh; background: #fff; color: var(--ink);
  border-radius: 22px 22px 0 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
  transform: translateY(101%); transition: transform .3s cubic-bezier(.32, .72, 0, 1);
  padding-bottom: calc(20px + var(--safe-b));
}
.sheet.open { transform: translateY(0); }
.sheet .grab { width: 38px; height: 4px; border-radius: 999px; background: #d3d8e6; margin: 9px auto 0; }
.sheet .shot { aspect-ratio: 16 / 9; margin-top: 10px; }
.sheet-body { padding: 16px 18px 0; }
.sheet-body h2 { margin: 0 0 8px; font-size: 22px; line-height: 1.38; font-weight: 800; letter-spacing: -.4px; }
.sheet-body .orig { margin: 0 0 12px; font-size: 13.5px; color: var(--faint); line-height: 1.5; }
.sheet-body .sum { font-size: 14.5px; line-height: 1.7; color: #333c56; margin: 0 0 16px; }
.sheet-body .foot { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--sub); flex-wrap: wrap; margin-bottom: 14px; }
.memo {
  width: 100%; border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 11px 12px; font-size: 14px; min-height: 74px; resize: vertical;
  background: #fafbfe; color: var(--ink);
}
.memo:focus { outline: 2px solid var(--royal); border-color: transparent; }
.memo-label { font-size: 12px; font-weight: 700; color: var(--sub); margin: 0 0 6px; }
.sheet-actions { display: flex; gap: 9px; padding: 16px 18px 0; }
.btn {
  flex: 1; border-radius: 13px; padding: 14px; font-size: 15px; font-weight: 700;
  text-align: center; display: flex; align-items: center; justify-content: center; gap: 7px;
}
.btn.primary { background: var(--royal); color: #fff; }
.btn.ghost { flex: none; width: 52px; background: #eef1f8; color: var(--sub); }
.btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn.ghost.on { background: #fff6e0; color: #d99000; }
.btn.ghost.on svg { fill: #ffb400; stroke: #ffb400; }

/* ─────────────── トースト ─────────────── */
.toast {
  position: fixed; left: 50%; bottom: calc(26px + var(--safe-b)); transform: translate(-50%, 20px);
  background: rgba(255, 255, 255, .97); color: var(--ink); font-size: 13.5px; font-weight: 600;
  padding: 11px 18px; border-radius: 999px; z-index: 80; opacity: 0;
  transition: opacity .2s, transform .2s; pointer-events: none;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<header class="top">
  <div class="wrap top-row">
    <div class="brand"><span class="mark"></span><b>Sabah</b><span>Lens</span></div>
    <div class="grow"></div>
    <button class="iconbtn" id="btnSearch" aria-label="検索">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    </button>
    <button class="iconbtn" id="btnUnread" aria-label="未読のみ">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h9"/></svg>
    </button>
    <button class="iconbtn" id="btnStar" aria-label="保存した記事">
      <svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/></svg>
    </button>
  </div>
  <div class="wrap searchbar" id="searchbar">
    <input id="q" type="search" placeholder="見出し・媒体名で検索" autocomplete="off">
  </div>
  <div class="chips" id="chips"></div>
</header>

<main class="wrap">
  <div class="meta-row" id="metaRow"></div>
  <div id="heroSlot"></div>
  <div class="feed" id="feed">
    <div class="skel"></div><div class="skel"></div>
  </div>
</main>

<div class="sheet-bg" id="sheetBg"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
<div class="toast" id="toast"></div>

<script>
'use strict';

const CACHE_LABEL = 'lens-v2';
const STATE_KEY = 'sabahlens_state';

/* ─── 端末内の状態。サーバーには一切送らない ─── */
const DEFAULT_STATE = { v: 1, read: {}, star: {}, memo: {}, unreadOnly: false, starOnly: false };
let state = load();

function load() {
  try {
    const raw = localStorage.getItem(STATE_KEY);
    if (raw) return Object.assign({}, DEFAULT_STATE, JSON.parse(raw));
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}
let saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); } catch (e) {}
  }, 120);
}

/* ─── タグの色。画像なしカードの面に使う ─── */
const TAG_COLORS = {
  '無国籍':     ['#3b2b8f', '#6d3bb5'],
  '難民':       ['#0d5c63', '#12938c'],
  '市民権':     ['#132f7a', '#1b56c9'],
  '入管・摘発': ['#7a1220', '#c62828'],
  '子ども':     ['#8a4b00', '#d98324'],
  '教育':       ['#4a2178', '#8447c9'],
  '医療・福祉': ['#0f5132', '#2e8b57'],
  'バジャウ':   ['#03426b', '#0484d6'],
  'ロヒンギャ': ['#8a3300', '#d96a1f'],
  '政策・政治': ['#2b3450', '#4c5878'],
  '人権・NGO':  ['#7a1050', '#c2308b'],
};
const FALLBACK_COLORS = ['#1f2b4d', '#3a4a7a'];
const colorsFor = tags => TAG_COLORS[(tags || [])[0]] || FALLBACK_COLORS;

/* ─── 表示ヘルパ ─── */
const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

function ago(iso) {
  if (!iso) return '';
  const t = Date.parse(iso);
  if (isNaN(t)) return '';
  const m = Math.floor((Date.now() - t) / 60000);
  if (m < 1) return 'たった今';
  if (m < 60) return m + '分前';
  const h = Math.floor(m / 60);
  if (h < 24) return h + '時間前';
  const d = Math.floor(h / 24);
  if (d < 30) return d + '日前';
  const mo = Math.floor(d / 30);
  if (mo < 12) return mo + 'ヶ月前';
  return Math.floor(mo / 12) + '年前';
}
const jaTitle = it => it.title_ja || it.title || '';
const showOrig = it => (it.title_ja && it.title && it.title_ja !== it.title) ? it.title : '';
const linkOf = it => it.url_real || it.url;
const isNew = it => it.first_seen && (Date.now() - Date.parse(it.first_seen)) < 36 * 3600 * 1000;

/* ─── データ ─── */
let ALL = [];
let activeTag = null;
let query = '';

const $ = s => document.querySelector(s);
const feedEl = $('#feed'), chipsEl = $('#chips'), heroSlot = $('#heroSlot'), metaRow = $('#metaRow');

function visible() {
  let list = ALL;
  if (activeTag) list = list.filter(it => (it.tags || []).includes(activeTag));
  if (state.unreadOnly) list = list.filter(it => !state.read[it.id]);
  if (state.starOnly) list = list.filter(it => state.star[it.id]);
  if (query) {
    const q = query.toLowerCase();
    list = list.filter(it =>
      (it.title_ja || '').toLowerCase().includes(q) ||
      (it.title || '').toLowerCase().includes(q) ||
      (it.source || '').toLowerCase().includes(q));
  }
  return list;
}

/* ─── 描画 ─── */

function cardHTML(it, i) {
  const t = jaTitle(it), orig = showOrig(it);
  const starOn = state.star[it.id] ? ' on' : '';
  const readCls = state.read[it.id] ? ' read' : '';
  const tags = (it.tags || []).slice(0, 2).map(tg => {
    const c = TAG_COLORS[tg];
    return c
      ? `<span class="tag k" style="background:${c[1]}">${esc(tg)}</span>`
      : `<span class="tag">${esc(tg)}</span>`;
  }).join('');

  const starBtn = `<button class="star${starOn}" data-star="${esc(it.id)}" aria-label="保存">
      <svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/></svg></button>`;
  const srcBadge = `<span class="badge-src">${esc(it.source || '')}</span>`;
  const newBadge = isNew(it) ? '<span class="newdot">NEW</span>' : '';

  let shot;
  if (it.image) {
    // loading=lazy と decoding=async でスクロールを止めない。
    // 参照元を送らないのは、媒体側のホットリンク制限に引っかかりにくくするため。
    shot = `<div class="shot">${srcBadge}${starBtn}${newBadge}
      <img loading="${i < 3 ? 'eager' : 'lazy'}" decoding="async" referrerpolicy="no-referrer"
           src="${esc(it.image)}" alt="${esc(it.image_alt || '')}"
           onload="this.classList.add('in')" onerror="this.closest('.shot').dataset.fail='1';this.remove()"></div>`;
  } else {
    const [c1, c2] = colorsFor(it.tags);
    shot = `<div class="shot type" style="--c1:${c1};--c2:${c2}">${srcBadge}${starBtn}${newBadge}
      <div class="tt">${esc(t)}</div></div>`;
  }

  const heading = it.image ? `<h3>${esc(t)}</h3>` : '';
  const origLine = (it.image && orig) ? `<p class="orig">${esc(orig)}</p>` : '';

  return `<article class="card${readCls}" data-open="${esc(it.id)}">
    ${shot}
    <div class="body">
      ${heading}${origLine}
      <div class="foot">${tags}<span>${esc(it.source || '')}</span><i class="dotsep"></i><span>${esc(ago(it.date))}</span></div>
    </div>
  </article>`;
}

function heroHTML(it) {
  const t = jaTitle(it), orig = showOrig(it);
  return `<a class="hero" data-open="${esc(it.id)}">
    <img src="${esc(it.image)}" alt="" referrerpolicy="no-referrer" decoding="async">
    <div class="scrim"></div>
    <div class="inner">
      <span class="kicker">${esc((it.tags || [])[0] || 'ピックアップ')}</span>
      <h2>${esc(t)}</h2>
      ${orig ? `<p class="orig">${esc(orig)}</p>` : ''}
      <div class="foot"><span>${esc(it.source || '')}</span><i class="dotsep"></i><span>${esc(ago(it.date))}</span></div>
    </div>
  </a>`;
}

/* 一度に描く枚数。写真は1枚80〜330KBあるので、全部まとめて出すと
   スクロールしただけで数十MB落ちる。下端に来たら継ぎ足す。 */
const PAGE = 24;
let shown = PAGE;
let pageList = [];

function renderPage() {
  feedEl.innerHTML = pageList.slice(0, shown).map(cardHTML).join('');
}

/* 下端が近づいたら継ぎ足す。IntersectionObserver を使わないのは、
   検証に使ったヘッドレスのブラウザで一切発火せず（body を観測しても0件）、
   動作を確かめられないまま載せることになるため。scroll なら確実に測れる。 */
let pumping = false;
function pump() {
  if (pumping) return;
  pumping = true;
  requestAnimationFrame(() => {
    pumping = false;
    if (shown >= pageList.length) return;
    const rest = document.body.scrollHeight - (window.scrollY + window.innerHeight);
    if (rest > 900) return;
    shown += PAGE;
    renderPage();
    pump();                  // 一気にスクロールされたときは続けて足す
  });
}
window.addEventListener('scroll', pump, { passive: true });
window.addEventListener('resize', pump, { passive: true });

function render(resetPage = true) {
  const list = visible();
  if (resetPage) shown = PAGE;

  // 先頭が未読で画像持ちならヒーローに昇格させる。既読だらけのときは無理に出さない。
  let rest = list, hero = null;
  if (!query && list.length > 3) {
    hero = list.find(it => it.image && !state.read[it.id]) || (list[0].image ? list[0] : null);
    if (hero) rest = list.filter(it => it !== hero);
  }
  heroSlot.innerHTML = hero ? heroHTML(hero) : '';

  if (!list.length) {
    pageList = [];
    feedEl.innerHTML = `<div class="empty"><div class="big">🔍</div>
      <p>${state.starOnly ? '保存した記事はまだありません' : state.unreadOnly ? '未読はありません。よく追えています' : '該当する記事がありません'}</p></div>`;
  } else {
    pageList = rest;
    renderPage();
    pump();       // 絞り込みで件数が減り、下端が既に近い場合に備える
  }

  const unread = ALL.filter(it => !state.read[it.id]).length;
  metaRow.innerHTML = `<span class="live"></span>
    <span>${ALL.length}件 · 未読 ${unread}件</span><i class="dotsep"></i>
    <span>更新 ${esc(ago(window.__updated))}</span>`;

  $('#btnUnread').classList.toggle('on', !!state.unreadOnly);
  $('#btnStar').classList.toggle('on', !!state.starOnly);
}

function renderChips() {
  const counts = {};
  for (const it of ALL) for (const tg of (it.tags || [])) counts[tg] = (counts[tg] || 0) + 1;
  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  chipsEl.innerHTML =
    `<button class="chip${activeTag ? '' : ' on'}" data-tag="">すべて<span class="n">${ALL.length}</span></button>` +
    sorted.map(([tg, n]) =>
      `<button class="chip${activeTag === tg ? ' on' : ''}" data-tag="${esc(tg)}">${esc(tg)}<span class="n">${n}</span></button>`
    ).join('');
}

/* ─── 詳細シート ─── */

const sheet = $('#sheet'), sheetBg = $('#sheetBg');
let openId = null;

function openSheet(id) {
  const it = ALL.find(x => x.id === id);
  if (!it) return;
  openId = id;

  if (!state.read[id]) { state.read[id] = 1; save(); }

  const t = jaTitle(it), orig = showOrig(it);
  const sum = it.summary_ja || it.summary || '';
  const tags = (it.tags || []).map(tg => {
    const c = TAG_COLORS[tg];
    return c ? `<span class="tag k" style="background:${c[1]}">${esc(tg)}</span>` : `<span class="tag">${esc(tg)}</span>`;
  }).join('');

  let shot = '';
  if (it.image) {
    shot = `<div class="shot"><img src="${esc(it.image)}" alt="" referrerpolicy="no-referrer"
      onload="this.classList.add('in')" onerror="this.closest('.shot').remove()"></div>`;
  }

  sheet.innerHTML = `<div class="grab"></div>
    ${shot}
    <div class="sheet-body">
      <h2>${esc(t)}</h2>
      ${orig ? `<p class="orig">${esc(orig)}</p>` : ''}
      ${sum ? `<p class="sum">${esc(sum)}</p>` : ''}
      <div class="foot">${tags}<span>${esc(it.source || '')}</span><i class="dotsep"></i><span>${esc(ago(it.date))}</span></div>
      <p class="memo-label">メモ</p>
      <textarea class="memo" id="memoBox" placeholder="この記事について気づいたこと">${esc(state.memo[id] || '')}</textarea>
    </div>
    <div class="sheet-actions">
      <a class="btn primary" href="${esc(linkOf(it))}" target="_blank" rel="noopener noreferrer">
        記事を開く
        <svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-8 8M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
      </a>
      <button class="btn ghost${state.star[id] ? ' on' : ''}" id="sheetStar" aria-label="保存">
        <svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/></svg>
      </button>
    </div>`;

  sheetBg.classList.add('open');
  sheet.classList.add('open');
  document.body.style.overflow = 'hidden';

  $('#memoBox').addEventListener('input', e => {
    const v = e.target.value.trim();
    if (v) state.memo[id] = v; else delete state.memo[id];
    save();
  });
  $('#sheetStar').addEventListener('click', () => {
    toggleStar(id);
    $('#sheetStar').classList.toggle('on', !!state.star[id]);
  });
}

function closeSheet() {
  sheetBg.classList.remove('open');
  sheet.classList.remove('open');
  document.body.style.overflow = '';
  openId = null;
  render(false);          // 読んだ記事の位置に戻れるよう、描画済みの枚数は保つ
}
sheetBg.addEventListener('click', closeSheet);

/* ─── 操作 ─── */

function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 1600);
}

function toggleStar(id) {
  if (state.star[id]) { delete state.star[id]; toast('保存を解除しました'); }
  else { state.star[id] = 1; toast('保存しました'); }
  save();
}

document.addEventListener('click', e => {
  const st = e.target.closest('[data-star]');
  if (st) {
    e.preventDefault(); e.stopPropagation();
    toggleStar(st.dataset.star);
    st.classList.toggle('on', !!state.star[st.dataset.star]);
    if (state.starOnly) render();
    return;
  }
  const op = e.target.closest('[data-open]');
  if (op) { e.preventDefault(); openSheet(op.dataset.open); return; }

  const chip = e.target.closest('[data-tag]');
  if (chip) {
    activeTag = chip.dataset.tag || null;
    renderChips(); render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
});

$('#btnUnread').addEventListener('click', () => {
  state.unreadOnly = !state.unreadOnly;
  if (state.unreadOnly) state.starOnly = false;
  save(); render();
  toast(state.unreadOnly ? '未読のみ表示' : 'すべて表示');
});
$('#btnStar').addEventListener('click', () => {
  state.starOnly = !state.starOnly;
  if (state.starOnly) state.unreadOnly = false;
  save(); render();
  toast(state.starOnly ? '保存した記事' : 'すべて表示');
});
$('#btnSearch').addEventListener('click', () => {
  const bar = $('#searchbar');
  bar.classList.toggle('open');
  $('#btnSearch').classList.toggle('on', bar.classList.contains('open'));
  if (bar.classList.contains('open')) $('#q').focus();
  else { $('#q').value = ''; query = ''; render(); }
});
$('#q').addEventListener('input', e => { query = e.target.value.trim(); render(); });

document.addEventListener('keydown', e => { if (e.key === 'Escape' && openId) closeSheet(); });

/* ─── 起動 ─── */

fetch('news.json', { cache: 'no-cache' })
  .then(r => r.json())
  .then(d => {
    window.__updated = d.updated;
    // 画像がある記事を少しだけ前に出す。日付順は崩さず、同日内でだけ入れ替える。
    ALL = (d.items || []).slice().sort((a, b) => {
      const da = (a.date || '').slice(0, 10), db = (b.date || '').slice(0, 10);
      if (da !== db) return db.localeCompare(da);
      return (b.image ? 1 : 0) - (a.image ? 1 : 0);
    });
    renderChips();
    render();
  })
  .catch(() => {
    feedEl.innerHTML = `<div class="empty"><div class="big">📡</div>
      <p>ニュースを読み込めませんでした。<br>通信を確認して開き直してください。</p></div>`;
  });

// ローカルでは Service Worker を使わない。
// キャッシュ優先なので、登録したままだと index.html を直しても古い版が出続け、
// 「直したのに変わらない」で毎回時間を溶かす。ついでに残骸も消しておく。
const IS_LOCAL = ['localhost', '127.0.0.1', '::1'].includes(location.hostname);
if (IS_LOCAL && 'serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
  if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k)));
}

if (!IS_LOCAL && 'serviceWorker' in navigator) {
  // 初回訪問では controller が付くだけなので読み直さない。
  // 2回目以降に SW が入れ替わったとき＝更新が来たときだけ読み直す。
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloaded) return;
    reloaded = true;
    location.reload();
  });
}
</script>
</body>
</html>
